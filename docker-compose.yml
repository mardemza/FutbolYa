services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3002:3002"
    volumes:
      - api-data:/app/apps/api/data
    environment:
      - PORT=3002
      - DATABASE_PATH=/app/apps/api/data/futbolya.sqlite
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_HOST=api
      - VITE_API_PORT=3002
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:
